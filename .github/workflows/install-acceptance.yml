name: Homebrew install acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            kernel: Darwin
            machine: arm64
            target: aarch64-apple-darwin
            runner_arch: ARM64
            brew_binary: /opt/homebrew/bin/brew
          - runner: ubuntu-22.04
            kernel: Linux
            machine: x86_64
            target: x86_64-unknown-linux-gnu
            runner_arch: X64
            brew_binary: /home/linuxbrew/.linuxbrew/bin/brew
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_UPGRADE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Verify runner and absent Steve homes
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == "${{ matrix.kernel }}" ]]
          [[ "$(uname -m)" == "${{ matrix.machine }}" ]]
          [[ "$RUNNER_ARCH" == "${{ matrix.runner_arch }}" ]]
          # Hosted images already include Homebrew; fail instead of invoking
          # setup-homebrew's fallback installer if the image contract changes.
          test -x "${{ matrix.brew_binary }}"
          for directory in "$HOME/.steve" "$HOME/.steve-node"; do
            if [[ -e "$directory" || -L "$directory" ]]; then
              printf '::error::Steve home already exists: %s\n' "$directory"
              exit 1
            fi
          done

      # This official action checks out this tap at GITHUB_SHA itself.
      - name: Set up stable Homebrew and check out the tap
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # main reviewed 2026-11-08
        with:
          stable: true
          core: false
          cask: false

      - name: Verify clean Steve installation state
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          test -s Formula/steve.rb
          test -s steve-installer.lock.json
          brew --version
          brew config
          installed_formulae="$(brew list --formula)"
          while IFS= read -r formula; do
            if [[ "$formula" == "steve" ]]; then
              printf '::error::Steve is already installed on this runner\n'
              exit 1
            fi
          done <<< "$installed_formulae"
          for directory in "$HOME/.steve" "$HOME/.steve-node"; do
            [[ ! -e "$directory" && ! -L "$directory" ]]
          done
          # setup-homebrew grants whole-tap trust. Remove that runner-local grant
          # so the real fully qualified install exercises Formula-level trust.
          brew untrust --tap infranite/tap
          # The official action has refreshed Homebrew and its metadata once.
          # Subsequent installation/test commands must not initiate auto-updates.
          printf 'HOMEBREW_NO_AUTO_UPDATE=1\n' >> "$GITHUB_ENV"

      - name: Install the published Steve package
        run: |
          set -euo pipefail
          brew install infranite/tap/steve
          for directory in "$HOME/.steve" "$HOME/.steve-node"; do
            [[ ! -e "$directory" && ! -L "$directory" ]]
          done

      - name: Run the Formula test and CLI smoke checks
        run: |
          set -euo pipefail
          brew test steve
          installed="$(brew list --versions steve)"
          read -r formula version extra <<< "$installed"
          [[ "$formula" == "steve" && -n "$version" && -z "${extra:-}" ]]
          actual="$(steve --version)"
          printf '%s\n' "$actual"
          [[ "$actual" == "steve CLI/package $version" ]]
          help="$(steve --help)"
          printf '%s\n' "$help"
          for command in setup hub node upgrade; do
            [[ "$help" == *"$command"* ]]
          done
          printf 'Formula test and CLI checks passed for Steve %s on %s (%s).\n' \
            "$version" "$RUNNER_OS" "$RUNNER_ARCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify native CLI without external runtimes
        run: |
          set -euo pipefail
          # Homebrew's JSON dependency fields exclude :implicit dependencies.
          # Linuxbrew can inject its own compiler/libc bottles even when this
          # Formula declares no dependencies. Check both contracts explicitly.
          formula_info="$(brew info --json=v2 steve)"
          printf '%s\n' "$formula_info"
          jq -e '
            (.formulae | length) == 1 and
            (.formulae[0] |
              .name == "steve" and
              ([.dependencies, .build_dependencies, .test_dependencies,
                .recommended_dependencies, .optional_dependencies, .uses_from_macos]
               | all(type == "array" and length == 0)))
          ' <<< "$formula_info" > /dev/null
          dependencies="$(brew deps steve)"
          printf 'Homebrew dependency closure (includes platform implicit dependencies):\n%s\n' "$dependencies"
          if printf '%s\n' "$dependencies" | grep -Eiq '(^|/)(python([@-].*)?|openssl(@.*)?)$'; then
            printf '::error::Steve dependency closure includes Python or OpenSSL\n'
            exit 1
          fi
          native="$(brew --prefix steve)/libexec/bin/steve"
          [[ "$native" == /* && -f "$native" && -x "$native" ]]
          description="$(file -L "$native")"
          printf '%s\n' "$description"
          case "${{ matrix.kernel }}" in
            Darwin)
              [[ "$description" == *"Mach-O 64-bit executable arm64"* ]]
              libraries="$(otool -L "$native")"
              ;;
            Linux)
              [[ "$description" == *"ELF 64-bit"* && "$description" == *"x86-64"* ]]
              if [[ "$description" == *"statically linked"* ]]; then
                libraries="statically linked"
              else
                libraries="$(ldd "$native")"
              fi
              ;;
          esac
          printf '%s\n' "$libraries"
          if printf '%s\n' "$libraries" | grep -Eiq 'lib(python|ssl|crypto)'; then
            printf '::error::Native CLI unexpectedly links a Python or OpenSSL runtime\n'
            exit 1
          fi

          # jq is CI inspection tooling; the three CLI invocations below have an
          # empty environment and a PATH containing no executable at all.
          expected_version="$(jq -er '.manifest.version' steve-installer.lock.json)"
          expected_commit="$(jq -er '.manifest.commit' steve-installer.lock.json)"
          jq -e '.manifest.cli_protocol == 2' steve-installer.lock.json > /dev/null
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/steve-native-smoke.XXXXXX")"
          empty_path="$scratch/empty-path"
          smoke_home="$scratch/absent-home"
          mkdir "$empty_path"
          [[ ! -e "$smoke_home" && ! -L "$smoke_home" ]]
          actual="$(/usr/bin/env -i HOME="$smoke_home" PATH="$empty_path" "$native" --version)"
          printf '%s\n' "$actual"
          [[ "$actual" == "steve CLI/package $expected_version" ]]
          help="$(/usr/bin/env -i HOME="$smoke_home" PATH="$empty_path" "$native" --help)"
          printf '%s\n' "$help"
          for command in setup hub node upgrade; do
            [[ "$help" == *"$command"* ]]
          done
          info="$(/usr/bin/env -i HOME="$smoke_home" PATH="$empty_path" "$native" --build-info)"
          printf '%s\n' "$info"
          jq -e --arg version "$expected_version" --arg commit "$expected_commit" \
            --arg target "${{ matrix.target }}" \
            '.version == $version and .commit == $commit and .target == $target
             and .cli_protocol == 2 and .native_install == true' <<< "$info" > /dev/null
          [[ ! -e "$smoke_home" && ! -L "$smoke_home" ]]
          for directory in "$HOME/.steve" "$HOME/.steve-node"; do
            [[ ! -e "$directory" && ! -L "$directory" ]]
          done
          printf 'Native CLI protocol 2 passed with no declared Steve dependencies, no Python/OpenSSL dependencies or linkage, an empty PATH, and no HOME creation on %s (%s).\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert no Steve data directories were created
        if: always()
        run: |
          set -euo pipefail
          for directory in "$HOME/.steve" "$HOME/.steve-node"; do
            if [[ -e "$directory" || -L "$directory" ]]; then
              printf '::error::Installation or CLI checks created a Steve home: %s\n' "$directory"
              exit 1
            fi
          done
          printf 'No Steve Hub or Node home exists after the checks; setup and services were not invoked.\n' \
            >> "$GITHUB_STEP_SUMMARY"
